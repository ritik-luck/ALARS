    <line class="split" x1="0" y1="36" x2="200" y2="36"/>
    <circle class="badge" cx="20" cy="18" r="11"/>
    <text class="title" x="16" y="22">C</text>
    <text class="title" x="38" y="23">AlertManager</text>
    <text class="text" x="16" y="64">generateAlert()</text>
  </g>

  <g transform="translate(330 1260)">
    <rect class="box" width="200" height="90"/>
    <line class="split" x1="0" y1="36" x2="200" y2="36"/>
    <circle class="badge" cx="20" cy="18" r="11"/>
    <text class="title" x="16" y="22">C</text>
    <text class="title" x="38" y="23">ReportService</text>
    <text class="text" x="16" y="64">generateReport()</text>
  </g>

  <g transform="translate(640 1120)">
    <rect class="box" width="200" height="130"/>
    <line class="split" x1="0" y1="36" x2="200" y2="36"/>
    <line class="split" x1="0" y1="94" x2="200" y2="94"/>
    <circle class="badge" cx="20" cy="18" r="11"/>
    <text class="title" x="16" y="22">C</text>
    <text class="title" x="38" y="23">AuditLog</text>
    <text class="text" x="16" y="58">auditID : String</text>
    <text class="text" x="16" y="80">action : String</text>
    <text class="text" x="16" y="116">record()</text>
  </g>

  <g transform="translate(900 1100)">
    <rect class="box" width="210" height="160"/>
    <line class="split" x1="0" y1="36" x2="210" y2="36"/>
    <line class="split" x1="0" y1="108" x2="210" y2="108"/>
    <circle class="badge" cx="20" cy="18" r="11"/>
    <text class="title" x="16" y="22">C</text>
    <text class="title" x="38" y="23">User</text>
    <text class="text" x="16" y="58">userID : String</text>
    <text class="text" x="16" y="78">name : String</text>
    <text class="text" x="16" y="98">role : String</text>
    <text class="text" x="16" y="130">login()</text>
    <text class="text" x="16" y="148">viewReport()</text>
  </g>

  <g transform="translate(48 1450)">
    <rect class="box" width="236" height="140"/>
    <line class="split" x1="0" y1="36" x2="236" y2="36"/>
    <line class="split" x1="0" y1="106" x2="236" y2="106"/>
    <circle class="badge" cx="20" cy="18" r="11"/>
    <text class="title" x="16" y="22">C</text>
    <text class="title" x="38" y="23">Alert</text>
    <text class="text" x="16" y="58">alertID : String</text>
    <text class="text" x="16" y="78">type : String</text>
    <text class="text" x="16" y="98">timeGenerated : DateTime</text>
    <text class="text" x="16" y="128">sendAlert()</text>
  </g>

  <g transform="translate(356 1450)">

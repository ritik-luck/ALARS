    <line class="split" x1="0" y1="36" x2="250" y2="36"/>
    <line class="split" x1="0" y1="108" x2="250" y2="108"/>
    <circle class="badge" cx="20" cy="18" r="11"/>
    <text class="title" x="16" y="22">C</text>
    <text class="title" x="38" y="23">Report</text>
    <text class="text" x="16" y="58">reportID : String</text>
    <text class="text" x="16" y="78">generatedDate : DateTime</text>
    <text class="text" x="16" y="98">content : String</text>
    <text class="text" x="16" y="132">generate()</text>
  </g>

  <g transform="translate(60 1660)">
    <rect class="box" width="240" height="86"/>
    <line class="split" x1="0" y1="36" x2="240" y2="36"/>
    <circle class="badge" cx="20" cy="18" r="11"/>
    <text class="title" x="16" y="22">C</text>
    <text class="title" x="38" y="23">NotificationService</text>
    <text class="text" x="16" y="62">notify()</text>
  </g>

  <g transform="translate(796 1450)">
    <rect class="box" width="120" height="86"/>
    <line class="split" x1="0" y1="36" x2="120" y2="36"/>
    <circle class="badge" cx="20" cy="18" r="11"/>

    <text class="text" x="16" y="58">ruleID : String</text>
    <text class="text" x="16" y="76">condition : String</text>
    <text class="text" x="16" y="94">riskLevel : String</text>
    <text class="text" x="16" y="122">evaluate()</text>
  </g>


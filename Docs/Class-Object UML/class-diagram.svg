    <text class="title" x="38" y="23">Viewer</text>
    <text class="text" x="16" y="62">viewReport()</text>
  </g>

  <g transform="translate(935 1450)">
    <rect class="box" width="140" height="86"/>
    <line class="split" x1="0" y1="36" x2="140" y2="36"/>
    <circle class="badge" cx="20" cy="18" r="11"/>
    <text class="title" x="16" y="22">C</text>
    <text class="title" x="38" y="23">AuthService</text>
    <text class="text" x="16" y="62">authenticate()</text>
  </g>

  <g transform="translate(1096 1450)">

    <line class="split" x1="0" y1="36" x2="240" y2="36"/>
    <line class="split" x1="0" y1="138" x2="240" y2="138"/>
    <circle class="badge" cx="20" cy="18" r="11"/>
    <text class="title" x="16" y="22">C</text>
    <text class="title" x="38" y="23">Incident</text>
    <text class="text" x="16" y="58">incidentID : String</text>
    <text class="text" x="16" y="80">severity : String</text>
    <text class="text" x="16" y="102">status : String</text>
    <text class="text" x="16" y="124">description : String</text>
    <text class="text" x="16" y="162">updateStatus()</text>
  </g>

  <g transform="translate(80 1260)">

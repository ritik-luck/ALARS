    <line class="split" x1="0" y1="36" x2="250" y2="36"/>
    <circle class="badge" cx="20" cy="18" r="11"/>
    <text class="title" x="16" y="22">C</text>
    <text class="title" x="38" y="23">IncidentManager</text>
    <text class="text" x="16" y="64">createIncident()</text>
  </g>

  <g transform="translate(345 960)">

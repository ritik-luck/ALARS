<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 860" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="title">ALARS Object Diagram</title>
  <desc id="desc">Object diagram showing log ingestion, incident creation, alerting, reporting, authentication, and audit relationships in ALARS.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L11,6 L1,11 Z" fill="#111827" stroke="#111827" stroke-width="1"/>
    </marker>
    <style>
      .box { fill: #b7d7ea; stroke: #333; stroke-width: 1.5; }
      .label { font-family: Arial, sans-serif; font-size: 14px; fill: #111; text-anchor: middle; font-weight: 600; }
      .title { font-family: Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #111; text-anchor: middle; }
      .edge { fill: none; stroke: #111827; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="0" y="0" width="1120" height="860" fill="#ffffff"/>

  <path class="edge" d="M145 92 L145 166"/>
  <path class="edge" d="M146 235 L268 335"/>
  <path class="edge" d="M430 235 L340 335"/>
  <path class="edge" d="M290 446 L290 530"/>
  <path class="edge" d="M350 446 L482 530"/>
  <path class="edge" d="M600 426 L600 530"/>
  <path class="edge" d="M758 426 L664 530"/>
  <path class="edge" d="M606 426 L772 530"/>
  <path class="edge" d="M1034 426 C1024 486 846 504 540 530"/>
  <path class="edge" d="M828 426 L864 530"/>
  <path class="edge" d="M1006 426 L948 530"/>
  <path class="edge" d="M225 624 L170 745"/>
  <path class="edge" d="M324 624 L410 745"/>

  <g>
    <rect class="box" x="20" y="20" width="250" height="82"/>
    <text class="title" x="145" y="44">RAW LOG</text>
    <text class="label" x="145" y="62">logID=L101</text>
    <text class="label" x="145" y="79">source=Firewall</text>
    <text class="label" x="145" y="96">message=MultipleFailedLogins</text>
  </g>

  <g>
    <rect class="box" x="58" y="166" width="176" height="68"/>
    <text class="title" x="146" y="187">NORMALISED LOG</text>
    <text class="label" x="146" y="205">normID=NL01</text>
    <text class="label" x="146" y="222">format=Structured</text>
  </g>

  <g>
    <rect class="box" x="288" y="150" width="302" height="92"/>
    <text class="title" x="439" y="174">RULE</text>
    <text class="label" x="439" y="194">ruleID=R5</text>
    <text class="label" x="439" y="214">condition=FailedLoginThreshold</text>
    <text class="label" x="439" y="234">riskLevel=High</text>
  </g>

  <g>
    <rect class="box" x="210" y="336" width="246" height="110"/>
    <text class="title" x="333" y="360">INCIDENT</text>
    <text class="label" x="333" y="381">incidentID=INC22</text>
    <text class="label" x="333" y="401">severity=High</text>
    <text class="label" x="333" y="421">status=Open</text>
    <text class="label" x="333" y="441">description=MultipleLoginFailures</text>
  </g>

  <g>
    <rect class="box" x="500" y="336" width="196" height="90"/>
    <text class="title" x="598" y="360">ADMIN</text>
    <text class="label" x="598" y="381">userID=U1</text>
    <text class="label" x="598" y="401">name=Admin</text>
    <text class="label" x="598" y="421">role=Administrator</text>
  </g>

  <g>
    <rect class="box" x="730" y="336" width="196" height="90"/>
    <text class="title" x="828" y="360">ANALYST</text>
    <text class="label" x="828" y="381">userID=U2</text>
    <text class="label" x="828" y="401">name=Analyst</text>
    <text class="label" x="828" y="421">role=SecurityAnalyst</text>
  </g>

  <g>
    <rect class="box" x="970" y="336" width="128" height="90"/>
    <text class="title" x="1034" y="360">VIEWER</text>
    <text class="label" x="1034" y="381">userID=U3</text>
    <text class="label" x="1034" y="401">name=Viewer</text>
    <text class="label" x="1034" y="421">role=Viewer</text>
  </g>

  <g>
    <rect class="box" x="206" y="530" width="168" height="94"/>
    <text class="title" x="290" y="555">ALERT</text>
    <text class="label" x="290" y="575">alertID=ALT7</text>
    <text class="label" x="290" y="595">type=SecurityAlert</text>
    <text class="label" x="290" y="615">priority=High</text>
  </g>

  <g>
    <rect class="box" x="480" y="530" width="242" height="78"/>
    <text class="title" x="601" y="554">REPORT</text>
    <text class="label" x="601" y="576">reportID=REP15</text>
    <text class="label" x="601" y="598">type=IncidentSummary</text>
  </g>

  <g>
    <rect class="box" x="748" y="530" width="232" height="78"/>
    <text class="title" x="864" y="554">AUTH SERVICE</text>
    <text class="label" x="864" y="576">service=Authentication</text>
  </g>

  <g>
    <rect class="box" x="80" y="744" width="186" height="72"/>
    <text class="title" x="173" y="768">AUDIT LOG</text>
    <text class="label" x="173" y="790">auditID=A77</text>
    <text class="label" x="173" y="809">action=AlertGenerated</text>
  </g>

  <g>
    <rect class="box" x="316" y="744" width="232" height="72"/>
    <text class="title" x="432" y="768">NOTIFICATION SERVICE</text>
    <text class="label" x="432" y="790">service=Notification</text>
  </g>
</svg>
